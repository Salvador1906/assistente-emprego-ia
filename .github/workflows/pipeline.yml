name: Execucao Diario Assistente Emprego IA

on:
  push:
    branches: [ main ]      # Executa automaticamente sempre que fazes 'git push' (ótimo para testar!)
  schedule:
    - cron: '0 9 * * *'     # Executa todos os dias às 09:00 UTC
  workflow_dispatch:        # Permite correr manualmente no site do GitHub a qualquer hora

jobs:
  executar_assistente:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar Codigo do Repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Executar a Triagem e Enviar Newsletter
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_DEST: ${{ secrets.EMAIL_DEST }}
      run: |
        # Executa o teu orquestrador unificado app.py que trata de todo o pipeline!
        python app.py